name: Armadasx3 Android unit tests

# JVM unit tests of the Android app (armsx3-ui). Fast and needs neither the core library nor the
# NDK. The full core + APK build is a separate, still-to-come workflow: it compiles LLVM and takes
# hours.

on:
  push:
    paths:
      - 'android/armsx3-ui/**'
      - '.github/workflows/armadasx3-android-unit-tests.yml'
  pull_request:
    paths:
      - 'android/armsx3-ui/**'
      - '.github/workflows/armadasx3-android-unit-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android/armsx3-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Unit tests (github debug)
        run: ./gradlew --no-daemon :app:testGithubDebugUnitTest

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armsx3-ui-unit-test-reports
          path: android/armsx3-ui/app/build/reports/tests/
          if-no-files-found: ignore
